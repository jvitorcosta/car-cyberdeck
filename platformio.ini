[platformio]
default_envs = cyd

[env]
monitor_speed = 115200

; Shared by both boards; each [env] pulls these in with ${common.*}.
[common]
platform = espressif32@6.9.0
framework = arduino
monitor_filters = esp32_exception_decoder
; Unifont CJK glyphs (tools/gen_cjk_font.py) stay in flash, read on demand
board_build.embed_files =
    data/cjk16.bin
    data/greeting.pcm
    data/montage.bin
    data/finale.pcm
    data/opener.pcm
; SpotifyArduino hard-codes SPOTIFY_DEBUG, which prints the refresh token and client secret
extra_scripts =
    ; firmware version from the git tag -> include/fw_version.h (git-ignored)
    pre:tools/version.py
    pre:tools/patch_spotify_lib.py
    ; boot greeting: data/greeting.pcm is your clip (git-ignored), else the default chime
    pre:tools/greeting_clip.py
    ; boot scene photo montage: data/montage.bin from tools/gen_montage.py (git-ignored), else empty
    pre:tools/montage_clip.py
    ; companion avatar: data/avatar.bin from tools/gen_avatar.py (git-ignored), else empty
    pre:tools/avatar_clip.py
    ; S3 boot intro video: data/intro.bin from tools/gen_intro.py (git-ignored), else empty
    pre:tools/intro_clip.py
    ; S3 music box tunes: data/tunes/*.txt from tools/gen_tune.py (git-ignored), else public domain
    pre:tools/tune_clip.py
    ; S3 pixel McQueen opening: data/mcqueen.bin from tools/gen_mcqueen_sprite.py (git-ignored), else off
    pre:tools/mcqueen_clip.py
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.4.3
    bodmer/TJpg_Decoder@1.1.0
    bitbank2/PNGdec@1.1.6
    https://github.com/witnessmenow/spotify-api-arduino.git#6261278
build_flags =
    -std=gnu++17
    ; ESP32 core logs: errors only (our [net]/[mem]/[spotify] lines use Serial directly)
    -D CORE_DEBUG_LEVEL=1
    ; silences TFT_eSPI's "TOUCH_CS pin not defined" #warning (the deck has no TFT_eSPI touch)
    -D DISABLE_ALL_LIBRARY_WARNINGS=1
    ; ---- TFT_eSPI: both boards have an ILI9341 on SPI; pins per board below ----
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_RST=-1
    -D TFT_BACKLIGHT_ON=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1
    -D SPI_READ_FREQUENCY=20000000
    -D USE_HSPI_PORT=1
build_unflags = -std=gnu++11
; Warnings for our code only (src/), not the core or third-party libraries; -Werror keeps src/ clean.
build_src_flags = -Wall -Wextra -Wshadow -Wdouble-promotion -Wlogical-op -Wduplicated-cond
    -Wnull-dereference -Wformat=2 -Werror

; ESP32-2432S028R "Cheap Yellow Display" (the first deck).
[env:cyd]
platform = ${common.platform}
framework = ${common.framework}
board = esp32dev
monitor_filters = ${common.monitor_filters}
board_build.partitions = huge_app.csv
board_build.embed_files = ${common.board_build.embed_files}
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -D BOARD_CYD=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_BL=21
    -D SPI_FREQUENCY=55000000
    ; TFT on HSPI (GPIO 12-15 are its native pins); VSPI stays free for the SD card.
    ; Sharing VSPI routed SD reads to the TFT MISO pin (fixed in commit 2b75c40).
build_unflags = ${common.build_unflags}
build_src_flags = ${common.build_src_flags}
build_src_filter = +<*> -<board/s3/> -<companion/> -<hwcheck.cpp> -<hwcheck_s3.cpp>

; Standalone hardware-check target for the CYD (display/colors/orientation/touch). Not the firmware.
;   pio run -e hwcheck -t upload
[env:hwcheck]
extends = env:cyd
; the touch controller is only exercised here (the firmware has no touch input)
lib_deps =
    ${common.lib_deps}
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d
build_src_filter = -<*> +<hwcheck.cpp>
; the hardware check uses none of the deck's media
board_build.embed_files =

; The CYD as a companion screen for the S3 (docs/superpowers/specs/2026-10-13-companion-screen-design.md):
; no Spotify, no Pokemon; the avatar home screen and the S3's lyrics (its /state, over the hotspot).
;   pio run -e cyd_companion -t upload --upload-port COM14
[env:cyd_companion]
extends = env:cyd
; the deck avatar lives on the companion (docs/superpowers/specs/2026-10-14-avatar-design.md)
board_build.embed_files =
    data/cjk16.bin
    data/avatar.bin
lib_deps =
    ${common.lib_deps}
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d
build_flags =
    ${env:cyd.build_flags}
    -D CARDECK_COMPANION=1
build_src_filter = -<*> +<companion/> +<util/> +<ui/battle.cpp> +<ui/theme.cpp> +<ui/textdraw.cpp>
    +<ui/accents.cpp> +<ui/cjkdata.cpp> +<ui/cjkfont.cpp> +<ui/backlight.cpp> +<net/wifi.cpp>
    +<net/clock.cpp> +<net/http_config.cpp> +<board/cyd/board_cyd.cpp> +<core/mem.cpp>

; Freenove FNK0104B: ESP32-S3R8 (8 MB octal PSRAM), 16 MB flash, 2.8" ILI9341 SPI, ES8311 codec.
; Flashes and logs over the S3's own USB port (no UART bridge).
[env:s3]
platform = ${common.platform}
framework = ${common.framework}
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 12582912
board_build.partitions = partitions_s3.csv
monitor_filters = ${common.monitor_filters}
; + the boot intro video and its sound (data/intro.bin/.pcm from tools/gen_intro.py) and the real
;   wolf howl (data/howl.pcm from tools/gen_howl.py) and a second greeting, picked at random
;   (data/greeting_alt.pcm from tools/gen_greeting.py --alt) and Sonic waiting on "Nothing playing"
;   (data/idle.bin from tools/gen_idle_sprite.py); git-ignored, else empty; and the music box's
;   tunes (data/tunes.txt, packed by tools/tune_clip.py)
board_build.embed_files =
    ${common.board_build.embed_files}
    data/intro.bin
    data/intro.pcm
    data/howl.pcm
    data/greeting_alt.pcm
    data/idle.bin
    data/tunes.txt
    data/mcqueen.bin
extra_scripts = ${common.extra_scripts}
; + a fast JPEG decoder for the boot intro video (ui/intro)
lib_deps =
    ${common.lib_deps}
    bitbank2/JPEGDEC@1.8.4
build_flags =
    ${common.build_flags}
    -D BOARD_S3=1
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Freenove's TFT_eSPI setup (FNK0104AB_2.8_240x320_ILI9341.h): own SPI bus, BGR panel
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=46
    -D TFT_BL=45
    -D TFT_RGB_ORDER=TFT_BGR
    -D SPI_FREQUENCY=40000000
build_unflags = ${common.build_unflags}
build_src_flags = ${common.build_src_flags}
build_src_filter = +<*> -<board/cyd/> -<companion/> -<hwcheck.cpp> -<hwcheck_s3.cpp>

; Standalone hardware check for the S3 (display, backlight, PSRAM, codec tone). Not the firmware.
;   pio run -e hwcheck_s3 -t upload --upload-port COM12
[env:hwcheck_s3]
extends = env:s3
build_src_filter = -<*> +<hwcheck_s3.cpp> +<board/s3/>
board_build.embed_files =

[env:native]
platform = native
test_framework = unity
; Host tests live in test/ and #include the pure modules from src/ directly. This env
; mainly fetches Unity into .pio/libdeps/native; tools/run_tests.ps1 compiles each suite with
; g++ (pio test -e native does not work for this layout).
build_flags = -std=gnu++17 -D UNIT_TEST
