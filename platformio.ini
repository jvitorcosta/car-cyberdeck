[platformio]
default_envs = s3

[env]
monitor_speed = 115200

; Shared by every build; each [env] pulls these in with ${common.*}.
[common]
platform = espressif32@6.9.0
framework = arduino
monitor_filters = esp32_exception_decoder
; Unifont CJK glyphs (tools/gen_cjk_font.py) stay in flash, read on demand
board_build.embed_files =
    data/cjk16.bin
    data/greeting.pcm
    data/montage.bin
    data/finale.pcm
    data/opener.pcm
extra_scripts =
    ; firmware version from the git tag -> include/fw_version.h (git-ignored)
    pre:tools/version.py
    ; boot greeting: data/greeting.pcm is your clip (git-ignored), else the default chime
    pre:tools/greeting_clip.py
    ; boot scene photo montage: data/montage.bin from tools/gen_montage.py (git-ignored), else empty
    pre:tools/montage_clip.py
    ; S3 boot intro video: data/intro.bin from tools/gen_intro.py (git-ignored), else empty
    pre:tools/intro_clip.py
    ; S3 pixel McQueen opening: data/mcqueen.bin from tools/gen_mcqueen_sprite.py (git-ignored), else off
    pre:tools/mcqueen_clip.py
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bodmer/TJpg_Decoder@1.1.0
    bitbank2/PNGdec@1.1.6
build_flags =
    -std=gnu++17
    ; ESP32 core logs: errors only (our [net]/[mem]/[spotify] lines use Serial directly)
    -D CORE_DEBUG_LEVEL=1
    ; silences TFT_eSPI's "TOUCH_CS pin not defined" #warning (the deck has no TFT_eSPI touch)
    -D DISABLE_ALL_LIBRARY_WARNINGS=1
    ; ---- TFT_eSPI: both boards have an ILI9341 on SPI; pins per board below ----
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_RST=-1
    -D TFT_BACKLIGHT_ON=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1
    -D SPI_READ_FREQUENCY=20000000
    -D USE_HSPI_PORT=1
build_unflags = -std=gnu++11
; Warnings for our code only (src/), not the core or third-party libraries; -Werror keeps src/ clean.
build_src_flags = -Wall -Wextra -Wshadow -Wdouble-promotion -Wlogical-op -Wduplicated-cond
    -Wnull-dereference -Wformat=2 -Werror

; ESP32-2432S028R "Cheap Yellow Display" (the yellow deck): the board settings its builds (ledpanel,
; hwcheck and the diagnostics) extend. Not a build itself. Its standalone Spotify deck build was
; retired on 2026-10-21 and its companion screen (cyd_companion) on 2026-10-28; both are in git history.
[cyd]
platform = ${common.platform}
framework = ${common.framework}
board = esp32dev
monitor_filters = ${common.monitor_filters}
board_build.partitions = huge_app.csv
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -D BOARD_CYD=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_BL=21
    -D SPI_FREQUENCY=55000000
    ; TFT on HSPI (GPIO 12-15 are its native pins).
build_unflags = ${common.build_unflags}
build_src_flags = ${common.build_src_flags}

; Standalone hardware-check target for the CYD (display/colors/orientation/touch). Not the firmware.
;   pio run -e hwcheck -t upload
[env:hwcheck]
extends = cyd
; the touch controller is only exercised here (the firmware has no touch input)
lib_deps =
    ${common.lib_deps}
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d
build_src_filter = -<*> +<diag/hwcheck.cpp>
; the hardware check uses none of the deck's media
board_build.embed_files =

; Standalone BLE scanner for the car's LED controllers on the CYD (yellow deck): lists advertisers,
; dumps each named device's GATT table to serial. Not the firmware.
;   pio run -e blescan -t upload -t monitor
[env:blescan]
extends = cyd
lib_deps = h2zero/NimBLE-Arduino@1.4.3
build_src_filter = -<*> +<diag/blescan.cpp>
board_build.embed_files =

; Control test for the car's two ELK LED controllers (src/diag/bletest.cpp): cycles colours on both.
;   pio run -e bletest -t upload -t monitor
[env:bletest]
extends = env:blescan
lib_deps =
    ${env:blescan.lib_deps}
    bodmer/TFT_eSPI@2.5.43
build_src_filter = -<*> +<diag/bletest.cpp>

; Xbox controller test on the CYD (src/diag/xboxtest.cpp): pairs over BLE, logs buttons and sticks.
;   pio run -e xboxtest -t upload -t monitor
[env:xboxtest]
extends = cyd
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    asukiaaa/XboxSeriesXControllerESP32_asukiaaa@1.1.2
build_src_filter = -<*> +<diag/xboxtest.cpp>
board_build.embed_files =

; PS3 (DualShock 3) controller test on the CYD (src/diag/ps3test.cpp): Bluetooth Classic via Bluedroid
; (esp32-ps3), so it can't live in the NimBLE LED panel. Logs button presses.
;   pio run -e ps3test -t upload -t monitor
[env:ps3test]
extends = cyd
lib_deps = jvpernis/PS3 Controller Host@1.1.0
build_src_filter = -<*> +<diag/ps3test.cpp>
board_build.embed_files =

; Touch LED panel for the car's lights on the CYD (src/yellow/ledpanel.cpp): colour buttons + intensity,
; voice (Siri Shortcuts -> GET /say over WiFi) and an Xbox controller (BLE). Not the firmware.
; YELLOW_DECK: on the hotspot it takes the yellow deck's pinned address, 172.20.10.11 (net/wifi).
; NimBLE 2 (the Xbox library needs it), unlike blescan/bletest's 1.4: those boot-loop on the bonds
; NimBLE 2 leaves in NVS, so erase flash before going back to them.
; Over USB (the first time on this partition table, or to recover); after that over WiFi (ledpanel_ota):
;   pio run -e ledpanel -t upload
[env:ledpanel]
; Its own settings on [cyd], not the BLE scanner's (a diagnostic): every key it needs is below.
extends = cyd
; Two 1.9 MB OTA app slots (updates over WiFi, net/ota) in place of [cyd]'s one 3 MB app (huge_app).
; Both tables put nvs at 0x9000 (0x5000 long) and otadata at 0xe000, so the one USB flash that
; switches tables keeps NVS: the touch calibration ("touch"/"hom"), the looks and the trip
; ("leds") and the controller's bond. The firmware is ~1.39 MB of the 1,966,080-byte slot.
board_build.partitions = min_spiffs.csv
; The lyrics' Japanese (tools/gen_jp_font.py, ~121 KB): Unifont kana + JIS level 1 kanji, read from flash
board_build.embed_files = data/jp16.bin
; lib/xboxpad is asukiaaa's Xbox library vendored (shorter connect timeout, gentler unbond); these
; are its own dependencies.
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    asukiaaa/XboxControllerNotificationParser@1.0.5
    asukiaaa/XboxSeriesXHIDReportBuilder_asukiaaa@1.0.1
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d
build_flags =
    ${cyd.build_flags}
    -D YELLOW_DECK=1
    ; TFT_eSPI's GFX free fonts: the panel's VT323 (src/yellow/fonts, yellow/ui/termfont) draws through setFreeFont
    -D LOAD_GFXFF=1
    ; NimBLE as central + observer only: the panel connects out to the lights and the Xbox pad and
    ; scans for them; it never advertises or serves GATT (-14 KB flash)
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED=1
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED=1
; Every text on the panel, the touch calibration's included, is VT323: TFT_eSPI's fonts 2 and 4
; aren't drawn (-9 KB flash)
build_unflags =
    ${cyd.build_unflags}
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
; Allow-list per deck folder (src/yellow, src/common and the util groups both decks share): the
; black deck's code isn't compiled here, so a call into it fails to link. Not http_config.cpp: the
; panel only uses its header's inline helpers, and the .cpp would link WiFiClientSecure's strings
; in (~1.3 KB of flash). util/car: the car-health screens' text and the OBD deck's /car format
; (healthview, carwire; the OBD link's modules are compiled but never linked).
build_src_filter = -<*> +<yellow/> +<common/> -<common/net/http_config.cpp> +<util/wire/> +<util/lights/>
    +<util/common/> +<util/yellow/> +<util/car/>

; The LED panel's firmware over WiFi (net/ota): build like ledpanel, upload with espota to the
; panel's pinned address on the iPhone hotspot. The PC must be on the hotspot too: from the home
; 5 GHz network the panel can't be reached. The password is OTA_PASSWORD
; (tools/ota_auth.py). Needs one USB flash of ledpanel first (the OTA partition table).
;   pio run -e ledpanel_ota -t upload
[env:ledpanel_ota]
extends = env:ledpanel
upload_protocol = espota
upload_port = 172.20.10.11
extra_scripts =
    ${env:ledpanel.extra_scripts}
    post:tools/ota_auth.py

; The OBD deck (src/obd): a generic ESP32 with no screen that owns the car's OBD link (the Vgate over
; BLE), the health check, the trip log on its own flash (LittleFS) and the fuel book, and serves
; GET /car and GET /fill (signed only) to the yellow deck over the hotspot (172.20.10.12,
; cardeck-obd.local). docs/ARCHITECTURE.md "OBD deck".
; Over USB the first time (the OTA partition table); after that over WiFi (obddeck_ota):
;   pio run -e obddeck -t upload --upload-port COMx
[env:obddeck]
platform = ${common.platform}
framework = ${common.framework}
board = esp32dev
monitor_filters = ${common.monitor_filters}
; Two 1.9 MB OTA app slots and a ~190 KB data partition ("spiffs") for the trip log (LittleFS).
board_build.partitions = min_spiffs.csv
board_build.embed_files =
; only the firmware version (include/fw_version.h); none of the decks' media
extra_scripts = pre:tools/version.py
; NimBLE 2.5.1 like the yellow deck, its default 3 connections (the adapter is the only one used)
lib_deps = h2zero/NimBLE-Arduino@2.5.1
build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=1
    -D OBD_DECK=1
    ; NimBLE as central + observer only: the deck connects out to the adapter and scans for it
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED=1
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED=1
build_unflags = ${common.build_unflags}
build_src_flags = ${common.build_src_flags}
; Allow-list: src/obd, the network half of src/common (no screen, no outgoing http) and the util
; groups it uses (util/wire for the signatures).
build_src_filter = -<*> +<obd/> +<common/net/> -<common/net/http_config.cpp> -<common/net/httpget.cpp>
    +<util/car/> +<util/common/> +<util/wire/>

; The OBD deck's firmware over WiFi (net/ota), from a PC on the hotspot like ledpanel_ota. The password
; is OTA_PASSWORD (tools/ota_auth.py). Needs one USB flash of obddeck first.
;   pio run -e obddeck_ota -t upload
[env:obddeck_ota]
extends = env:obddeck
upload_protocol = espota
upload_port = cardeck-obd.local
extra_scripts =
    ${env:obddeck.extra_scripts}
    post:tools/ota_auth.py

; Freenove FNK0104B: ESP32-S3R8 (8 MB octal PSRAM), 16 MB flash, 2.8" ILI9341 SPI, ES8311 codec.
; Flashes and logs over the S3's own USB port (no UART bridge).
[env:s3]
platform = ${common.platform}
framework = ${common.framework}
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
; one 3 MB OTA slot (partitions_s3.csv)
board_upload.maximum_size = 3145728
board_build.partitions = partitions_s3.csv
monitor_filters = ${common.monitor_filters}
; The S3's media live in their own partition (core/media, tools/pack_media.py), not the app:
;   pio run -e s3 -t uploadmedia
; packs data/ (the boot intro video and its sound, the real wolf howl, the second greeting,
; Sonic, McQueen, the montage, the CJK font, the emoji) and flashes it over USB.
; Only the default chime stays embedded, so an empty partition still boots with sound.
board_build.embed_files =
    data/greeting_default.pcm
extra_scripts =
    ${common.extra_scripts}
    post:tools/media_upload.py
; + a fast JPEG decoder for the boot intro video (ui/intro)
lib_deps =
    ${common.lib_deps}
    bitbank2/JPEGDEC@1.8.4
; Testing the boot openings: add  -D INTRO_FORCE=\"kiss\"  (or honda, mcqueen, max) to build_flags.
build_flags =
    ${common.build_flags}
    -D BOARD_S3=1
    -D MEDIA_PARTITION=1
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Freenove's TFT_eSPI setup (FNK0104AB_2.8_240x320_ILI9341.h): own SPI bus, BGR panel
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=46
    -D TFT_BL=45
    -D TFT_RGB_ORDER=TFT_BGR
    -D SPI_FREQUENCY=40000000
    ; PNGdec's two-line buffer, sized for walk sheets up to 512 px RGBA (walksprite SHEET_MAX_W).
    ; The default fits ~316 px, which sent 320 px sheets (Doublade) to the fallback sprite.
    ; In build_flags, not build_src_flags: the library must see the same PNG struct size.
    -D PNG_MAX_BUFFERED_PIXELS=4128
; No smooth (.vlw) fonts on the S3: nothing calls loadFont, and the code is ~16.8 KB of flash.
; Font 4 stays: the status box (screen_now) and the update screen (otascreen) draw with it.
build_unflags =
    ${common.build_unflags}
    -D SMOOTH_FONT=1
build_src_flags = ${common.build_src_flags}
; Allow-list per deck folder, as ledpanel: src/black, src/common and the util groups it uses.
build_src_filter = -<*> +<black/> +<common/> +<util/wire/> +<util/lights/> +<util/common/> +<util/black/>

; The S3's firmware over WiFi (net/ota), from a PC on the deck's network (home WiFi, or the PC on
; the iPhone hotspot: --upload-port 172.20.10.10). The password is OTA_PASSWORD (tools/ota_auth.py).
; Media still go over USB (uploadmedia).
;   pio run -e s3_ota -t upload
[env:s3_ota]
extends = env:s3
upload_protocol = espota
upload_port = cardeck.local
extra_scripts =
    ${env:s3.extra_scripts}
    post:tools/ota_auth.py

; Standalone hardware check for the S3 (display, backlight, PSRAM, codec tone). Not the firmware.
;   pio run -e hwcheck_s3 -t upload --upload-port COM12
[env:hwcheck_s3]
extends = env:s3
build_src_filter = -<*> +<diag/hwcheck_s3.cpp> +<black/board/s3/>
board_build.embed_files =

[env:native]
platform = native
test_framework = unity
; Host tests live in test/ and #include the pure modules from src/ directly. This env
; mainly fetches Unity into .pio/libdeps/native; tools/run_tests.ps1 compiles each suite with
; g++ (pio test -e native does not work for this layout).
build_flags = -std=gnu++17 -D UNIT_TEST
