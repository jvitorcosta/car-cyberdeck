name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]   # releases are built too
  pull_request:

# Read-only token: CI only builds and tests.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the run still going; a push to main never
# cancels, so every merge keeps its own finished build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  firmware:
    name: Firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # each deck's firmware and its board's hardware check; part = app partition size
          # (platformio.ini). The flash check reads .pio/build/<board>/firmware.bin.
          - board: s3
            envs: -e s3 -e s3_ota -e hwcheck_s3
            part: "0x300000"   # partitions_s3.csv (one OTA slot)
          # the yellow deck (the LED panel on the CYD) and the CYD's hardware check
          - board: ledpanel
            envs: -e ledpanel -e hwcheck
            part: "0x1E0000"   # min_spiffs.csv (two OTA slots)
          # the OBD deck (no hardware check of its own: a plain ESP32 with nothing attached)
          - board: obddeck
            envs: -e obddeck -e obddeck_ota -e obddeck_bench
            part: "0x1E0000"   # min_spiffs.csv (two OTA slots)
          # the diagnostic envs nobody flashes often: built so a shared-header break shows up
          # here and not on the bench. No part: they have no size budget to check.
          - board: diag
            envs: -e blescan -e bletest -e ps3test -e irtest -e ledpanel_probe -e hwcheck_panel
            part: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # tags, for the firmware version (tools/version.py)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ matrix.board }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-${{ matrix.board }}-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Stub config (the real src/config.h is git-ignored)
        run: cp include/config.example.h src/config.h
      - name: Media stand-ins at the real sizes (the media are git-ignored)
        run: python tools/media_sizes.py placeholders
      - name: Build
        shell: bash   # pipefail: a failed build still fails the step through the tee
        run: pio run ${{ matrix.envs }} 2>&1 | tee build.log
      - name: Flash size check
        if: matrix.part != ''
        run: python tools/check_flash.py .pio/build/${{ matrix.board }}/firmware.bin ${{ matrix.part }} 97
      - name: "Static RAM check (PlatformIO RAM line of every env built; today 20 to 24 %)"
        run: |
          grep -E '^RAM:' build.log
          awk '/^RAM:/ { for (i = 1; i <= NF; i++) if ($i ~ /%$/) { sub("%", "", $i); if ($i + 0 > 35) { print "static RAM over 35 %: " $0; bad = 1 } } } END { exit bad }' build.log
      - name: ELF and map of the build (to bisect a size or heap change)
        if: matrix.part != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.board }}-${{ github.sha }}
          path: |
            .pio/build/${{ matrix.board }}/firmware.elf
            .pio/build/${{ matrix.board }}/firmware.map
          retention-days: 14
          if-no-files-found: warn
      - name: Media pack size check (the S3's media partition)
        if: matrix.board == 's3'
        run: |
          python tools/pack_media.py .pio/media.bin --allow-stand-ins
          python tools/check_flash.py .pio/media.bin 0x9E0000 95

  host-tests:
    name: Host unit tests (Unity + g++, sanitizers, 64- and 32-bit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            .pio/libdeps/native
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-native-
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install PlatformIO, Unity and 32-bit g++
        run: |
          pip install platformio==6.2.0
          pio pkg install -e native -l throwtheswitch/Unity@2.6.0
          sudo apt-get update && sudo apt-get install -y g++-multilib
      - name: Run all suites (64-bit, ASan + UBSan)
        shell: pwsh
        run: ./tools/run_tests.ps1
      - name: Tool tests (tools/test_*.py; Pillow so the generator suites run, not skip)
        # pytest, not unittest discover: 58 of the 204 tests are plain pytest functions that unittest never sees
        run: |
          pip install pillow pytest
          python -m pytest -q tools
      - name: Run all suites (32-bit like the ESP32's size_t, sanitizers off)
        shell: pwsh
        env:
          NTEST_FLAGS: -m32
          NTEST_SAN: "0"
        run: ./tools/run_tests.ps1

  lint:
    name: Lint (actionlint, ruff F)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: "Workflow syntax (actionlint) and Python errors (ruff F: unused and undefined names)"
        run: |
          pip install actionlint-py ruff
          actionlint
          ruff check --select F tools
